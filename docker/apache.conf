# Configuration Apache de l'application (nommée zz- pour être chargée en dernier)
<Directory /var/www/html/public>
    AllowOverride All
</Directory>

# Dossier des images envoyées : aucun script ne peut y être exécuté,
# même si un fichier malveillant passait les contrôles d'upload (défense en profondeur)
<Directory /var/www/html/public/assets/img/menus/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar|php\d)$">
        Require all denied
    </FilesMatch>
</Directory>

# Ne pas révéler la version d'Apache ni du système
ServerTokens Prod
ServerSignature Off
