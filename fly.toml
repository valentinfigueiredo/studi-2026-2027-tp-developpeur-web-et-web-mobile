# Configuration de déploiement Fly.io (https://fly.io/docs/reference/configuration/)
app = "vite-et-gourmand-valentin-figueiredo"
primary_region = "cdg"   # Paris : au plus près des clients bordelais

[build]
  dockerfile = "Dockerfile"

[env]
  APP_DEBUG = "false"
  DB_PORT = "3306"
  MONGO_DB = "vite_gourmand"
  MAIL_PORT = "587"
  # Les secrets (mots de passe, URI) sont définis avec "fly secrets set", jamais ici

[http_service]
  internal_port = 8080
  force_https = true          # toute requête HTTP est redirigée en HTTPS
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
